<!DOCTYPE html>
<html lang=""en">
    <head>
        <meta charset="utf-8" />
        <title>snowglobe</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="hero">
            <h1>snowglobe</h1>
            <p class="tagline">shake it for a little winter joy</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="globe.png" alt="snowglobe" />
                </div>
                <button id="shake">shake the globe</button>
                <p class="message" id="message">press the button for a treat</p>
            </section>
        </main>
        <footer>
            <p>made by me, (i was bored)</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
